name: Build and check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: dotnet test tests/Jellyfin.Plugin.TagEditor.Tests --configuration Release
      - run: python3 scripts/package.py --no-build --manifest-output artifacts/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: tag-editor-package
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*manifest.json
